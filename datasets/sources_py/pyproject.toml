[project]
name = "hackathon-dge-gestion-des-flux"
version = "0.1.0"
description = "Scripts Python pour le hackathon DGE de gestion des flux touristiques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium",
    "geopandas",
    "matplotlib",
    "numpy",
    "openpyxl",
    "osmnx",
    "pandas",
    "pyarrow",
    "requests",
    "shapely",
    "urllib3",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest",
    "ruff",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.pyright]
include = ["src/**/*.py", "tests/**/*.py"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
# Les bibliothèques tierces (matplotlib, folium, geopandas...) exposent des
# signatures avec **kwargs: Unknown que Pyright ne peut pas résoudre.
reportUnknownMemberType = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # lignes trop longues : gérées par le formateur
]
